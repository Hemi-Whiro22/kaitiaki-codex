tasks:
  - carve: /upload route
    module: src.routes.upload
    description: Accepts taonga and metadata, stores in Supabase
  - carve: /ingest/{id}
    module: src.routes.ingest
    description: Triggers Tiwhanawhana pipeline
  - carve: /summarize/{id}
    module: src.routes.summarize
    description: Calls Ruru to summarize
  - carve: /embed/{id}
    module: src.routes.embed
    description: Calls Mataroa to embed
  - carve: /chat/{thread}
    module: src.routes.chat
    description: Logs kōrero and responds
  - carve: /search
    module: src.routes.search