profile: devcontainer-local

servers:
  local_inference:
    purpose: expose a local inference service to clients or coding tools
    transport: http
    endpoint: http://127.0.0.1:8090
    runtime: llama.cpp
    enabled_by_default: false
    notes:
      - MCP exposes the capability surface; it does not create GPU offload by itself.
      - GPU use depends on the llama.cpp build and launch flags.
      - Prefer local GGUF models for this profile when practical.

  local_guardian:
    purpose: future local bridge for guarded tool calls or profile-scoped actions
    transport: http
    endpoint: http://127.0.0.1:8172
    enabled_by_default: false
    notes:
      - keep guardian decisions separate from model reasoning
      - only expose tools that fit this profile scope
